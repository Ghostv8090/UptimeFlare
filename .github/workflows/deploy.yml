name: Deploy to Cloudflare

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix worker

      - name: Check configuration
        run: |
          npm run lint
          npx tsc --noEmit --incremental false

      - name: Build Pages
        run: npx @cloudflare/next-on-pages

      - name: Resolve Cloudflare account
        id: account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CONFIGURED_ACCOUNT_ID" ]; then
            account_id="$CONFIGURED_ACCOUNT_ID"
          else
            account_id=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id // empty')
          fi
          test -n "$account_id"
          echo "id=$account_id" >> "$GITHUB_OUTPUT"

      # Keep the existing D1 database and Pages project. No resource creation or
      # Terraform apply is needed for monitor configuration changes.
      - name: Deploy monitor Worker
        run: npm run deploy --prefix worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.id }}

      - name: Deploy status page
        run: npx wrangler pages deploy .vercel/output/static --project-name uptimeflare --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.id }}
